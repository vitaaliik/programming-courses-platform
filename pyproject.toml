[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

sqlalchemy = "*"
pydantic-settings = "*"

[project]
name = "programming-courses"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "sqlalchemy>=2.0.49",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
    "passlib>=1.7.4",
    "python-dotenv>=1.2.2",
]