<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container header-content">
            <h1 class="logo">Коледж</h1>
            <nav>
                <a href="/" class="nav-link">Головна</a>
                <a href="/courses" class="nav-link">Курси</a>

                {% if username %}
                    <a href="/profile" class="nav-link">Профіль</a>
                    <a href="/logout" class="auth-btn">Вийти</a>
                {% else %}
                    <a href="/login" class="auth-btn">Вхід</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Реєстрація</h2>

            <form id="register-form">
                <label for="username">Нікнейм</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Email</label>
                <input type="text" id="email" name="email" required>

                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required>

                <label for="confirm_password">Підтвердження пароля</label>
                <input type="password" id="confirm_password" name="confirm_password" required>

                <p id="register-message" class="form-message error-message" style="display:none;"></p>

                <button type="submit">Зареєструватися</button>
            </form>

            <p class="register-link">
                Уже зареєстровані?
                <a href="/login">Вхід</a>
            </p>
        </div>
    </main>

    <script>
        const registerForm = document.getElementById("register-form");
        const registerMessage = document.getElementById("register-message");

        registerForm.addEventListener("submit", async function(e) {
            e.preventDefault();

            const formData = new FormData(registerForm);

            const response = await fetch("/register", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (data.ok) {
                window.location.href = data.redirect;
            } else {
                registerMessage.style.display = "block";
                registerMessage.textContent = data.message;
            }
        });
    </script>
</body>
</html>
