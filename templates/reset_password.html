<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новий пароль</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container header-content">
            <h1 class="logo">Пароль</h1>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Створіть новий пароль</h2>

            <form id="reset-form">
                <input type="hidden" name="email" value="{{ reset_email }}">
                <input type="hidden" name="code" value="{{ reset_code }}">

                <label for="new_password">Новий пароль</label>
                <input type="password" id="new_password" name="new_password" required>

                <label for="confirm_password">Підтвердіть пароль</label>
                <input type="password" id="confirm_password" name="confirm_password" required>

                <p id="reset-message" class="form-message error-message" style="display:none;"></p>

                <button type="submit">Змінити пароль</button>
            </form>
        </div>
    </main>

    <script>
        const resetForm = document.getElementById("reset-form");
        const resetMessage = document.getElementById("reset-message");

        resetForm.addEventListener("submit", async function(e) {
            e.preventDefault();

            const formData = new FormData(resetForm);

            const response = await fetch("/reset-password", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (data.ok) {
                window.location.href = data.redirect;
            } else {
                resetMessage.style.display = "block";
                resetMessage.textContent = data.message;
            }
        });
    </script>
</body>
</html>
